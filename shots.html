<!DOCTYPE html>
<html>
<head>
<title>Kit thumbnails</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="description" content="Free (CC0) Smooth Voxel models in the Webspaces house style. View source to copy any of them." />
<script src="https://webspaces.space/run/0.10.0-alpha.12/webspace.js"></script>
<meta name="webspace.environment.type" content="terrain" />
<meta name="webspace.environment.terrain.type" content="flat" />
<meta name="webspace.environment.wrap" content="off" />
<meta name="webspace.environment.terrain.colors.sky" content="#9fc3e0" />
<meta name="webspace.environment.terrain.colors.ground" content="#c9c2b2" />
<meta name="webspace.environment.terrain.colors.grass" content="#b8b19f" />
<meta name="webspace.environment.terrain.colors.edge" content="#8f8878" />
<meta name="webspace.environment.terrain.colors.rock" content="#9a958c" />
<meta name="webspace.environment.terrain.colors.leaves" content="#6fae5c" />
<meta name="webspace.environment.terrain.colors.bark" content="#6b4a34" />
<meta name="webspace.environment.terrain.colors.water" content="#5f8fb8" />
<meta name="webspace.environment.spawn_point.transform" content="translate3d(0cm, 0cm, 200cm)" />
<meta name="webspace.environment.spawn_point.radius" content="0" />
</head>
<body>
<model id="m-bench" src="models/bench.svox" style="transform: translate3d(0cm, 119cm, -400cm)"></model>
<model id="m-bush" src="models/bush.svox" style="transform: translate3d(500cm, 106cm, -400cm)"></model>
<model id="m-cloud" src="models/cloud.svox" style="transform: translate3d(1000cm, 112cm, -400cm)"></model>
<model id="m-crate" src="models/crate.svox" style="transform: translate3d(1500cm, 112cm, -400cm)"></model>
<model id="m-crystal" src="models/crystal.svox" style="transform: translate3d(2000cm, 144cm, -400cm)"></model>
<model id="m-flower" src="models/flower.svox" style="transform: translate3d(2500cm, 125cm, -400cm)"></model>
<model id="m-lantern" src="models/lantern.svox" style="transform: translate3d(3000cm, 131cm, -400cm)"></model>
<model id="m-log" src="models/log.svox" style="transform: translate3d(3500cm, 100cm, -400cm)"></model>
<model id="m-mushroom" src="models/mushroom.svox" style="transform: translate3d(4000cm, 119cm, -400cm)"></model>
<model id="m-pine" src="models/pine.svox" style="transform: translate3d(4500cm, 188cm, -400cm)"></model>
<model id="m-rock" src="models/rock.svox" style="transform: translate3d(5000cm, 100cm, -400cm)"></model>
<model id="m-stone" src="models/stone.svox" style="transform: translate3d(5500cm, 94cm, -400cm)"></model>
<model id="m-tree" src="models/tree.svox" style="transform: translate3d(6000cm, 156cm, -400cm)"></model>
</body>
</html>
